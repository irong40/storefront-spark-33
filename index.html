<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="theme-color" content="#16a34a" />
    <title>imPRESSive Juice Bar | Cold-Pressed Juice Bar in Portsmouth, VA</title>
    <!-- data-rh="true" marks tags react-helmet-async owns: PageSeo replaces them
         after render instead of adding duplicates. Non-JS scrapers see these.
         No static canonical or og:url here: the shell is served for every URL,
         so a fixed value would point every page at the homepage. PageSeo sets
         both per page. -->
    <meta name="description" content="Cold-pressed juices, wellness shots and juice cleanses at 719 High St, Portsmouth, VA. Order online for pickup. Organic. Elevated. Extraordinary." data-rh="true" />
    <meta name="author" content="imPRESSive Juice Bar" />

    <meta property="og:title" content="imPRESSive Juice Bar | Cold-Pressed Juice Bar in Portsmouth, VA" data-rh="true" />
    <meta property="og:description" content="Cold-pressed juices, wellness shots and juice cleanses at 719 High St, Portsmouth, VA. Order online for pickup. Organic. Elevated. Extraordinary." data-rh="true" />
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="imPRESSive Juice Bar" />
    <meta property="og:image" content="https://www.impressivejb.com/og-image.jpg" data-rh="true" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@impressivejuice" />
    <meta name="twitter:image" content="https://www.impressivejb.com/og-image.jpg" data-rh="true" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Structured Data: one @graph. The business @id is referenced by the
         Product JSON-LD in ProductDetail.tsx. Hours mirror the business_settings
         row (see src/config/business.ts). geo: the US Census geocoder and
         OpenStreetMap both place 719 High St, 23704 at 36.8352, -76.3056. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "FoodEstablishment",
          "@id": "https://www.impressivejb.com/#business",
          "name": "imPRESSive Juice Bar",
          "description": "Fresh cold-pressed juices made daily with no added sugar, no preservatives.",
          "url": "https://www.impressivejb.com/",
          "telephone": "+1-757-381-6980",
          "email": "info@impressivejb.com",
          "image": "https://www.impressivejb.com/og-image.jpg",
          "logo": "https://www.impressivejb.com/icon-512.png",
          "servesCuisine": [
            "Cold-Pressed Juice",
            "Juice Bar",
            "Salads"
          ],
          "priceRange": "$$",
          "hasMenu": "https://www.impressivejb.com/products",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "719 High St",
            "addressLocality": "Portsmouth",
            "addressRegion": "VA",
            "postalCode": "23704",
            "addressCountry": "US"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 36.83515,
            "longitude": -76.30562
          },
          "hasMap": "https://www.google.com/maps/search/?api=1&query=imPRESSive+Juice+Bar+719+High+St+Portsmouth+VA+23704",
          "containedInPlace": {
            "@type": "Place",
            "name": "Bloom Market",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "719 High St",
              "addressLocality": "Portsmouth",
              "addressRegion": "VA",
              "postalCode": "23704",
              "addressCountry": "US"
            }
          },
          "parentOrganization": {
            "@id": "https://www.impressivejb.com/#organization"
          },
          "sameAs": [
            "https://www.facebook.com/impressivejb",
            "https://www.instagram.com/impressive_jb/"
          ],
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": [
                "Tuesday",
                "Wednesday",
                "Thursday",
                "Friday"
              ],
              "opens": "07:00",
              "closes": "19:00"
            },
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": "Saturday",
              "opens": "08:00",
              "closes": "17:00"
            }
          ]
        },
        {
          "@type": "Organization",
          "@id": "https://www.impressivejb.com/#organization",
          "name": "imPRESSive Juice Bar",
          "url": "https://www.impressivejb.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.impressivejb.com/icon-512.png",
            "width": 512,
            "height": 512
          },
          "email": "info@impressivejb.com",
          "telephone": "+1-757-381-6980",
          "founder": {
            "@type": "Person",
            "name": "Delisea Jackson"
          },
          "sameAs": [
            "https://www.facebook.com/impressivejb",
            "https://www.instagram.com/impressive_jb/"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.impressivejb.com/#website",
          "url": "https://www.impressivejb.com/",
          "name": "imPRESSive Juice Bar",
          "inLanguage": "en-US",
          "publisher": {
            "@id": "https://www.impressivejb.com/#organization"
          }
        }

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
